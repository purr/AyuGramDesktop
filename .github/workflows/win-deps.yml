name: Windows dependencies

# One attempt at building the Windows third-party tree.
#
# Called repeatedly (and sequentially) by build.yml. GitHub's 6h limit is per
# JOB, not per run, so each call gets a fresh 6h window and the chain continues
# a cold build automatically instead of asking a human to press Re-run.
#
# prepare.py checkpoints per stage, so a call that inherits a finished tree
# skips every stage and returns in minutes. Calls after the tree is complete are
# gated off by the caller anyway.

on:
  workflow_call:
    inputs:
      attempt:
        description: 'Which attempt in the chain this is, for logging'
        type: number
        required: true
    outputs:
      done:
        description: "'true' once the dependency tree is complete"
        value: ${{ jobs.deps.outputs.done }}

permissions:
  contents: read

jobs:

  deps:
    name: Attempt ${{ inputs.attempt }}
    runs-on: windows-latest
    timeout-minutes: 350

    outputs:
      done: ${{ steps.classify.outputs.done }}

    env:
      PREPARE_PATH: 'Telegram/build/prepare/prepare.py'
      # Leaves ~50 min inside the 350 min job cap for checkout, cache restore,
      # pruning and the cache save. The save is what makes the next attempt
      # cheaper, so it must never be the thing that gets cut off.
      LIBS_BOX_MINUTES: '295'

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo REPO_NAME=${{ github.event.repository.name }}>>%GITHUB_ENV%

      - name: Clone.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ github.event.repository.name }}

      # Must run before CACHE_KEY is computed: the key hashes prepare.py, and
      # this edits it. Patching after would key the cache on the wrong content.
      - name: Apply CI patches.
        shell: bash
        run: bash "$TBUILD/$REPO_NAME/.github/scripts/ci-patch.sh" "$TBUILD/$REPO_NAME"

      - name: First set up.
        shell: bash
        run: |
          echo "CACHE_KEY=$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> $GITHUB_ENV

          # Glob rather than pin the filename: upstream renamed this doc
          # building-win-x64.md -> building-win.md in 7.0.9 and the hardcoded
          # path took the whole dependency build down with a bare grep ENOENT.
          # A rename is not a reason to fail; a missing SDK line still is.
          DOCPATH="$(ls "$TBUILD/$REPO_NAME"/docs/building-win*.md 2>/dev/null | head -n1)"
          if [ -z "$DOCPATH" ]; then
            echo "::error::No docs/building-win*.md in the checkout — cannot read the Windows SDK version."
            exit 1
          fi
          SDK="$(grep 'SDK version' "$DOCPATH" | sed -r 's/.*with \*\*(.*)\*\* SDK version.*/\1/')"
          if [ -z "$SDK" ] || [ "$SDK" = "$(grep 'SDK version' "$DOCPATH")" ]; then
            echo "::error::Could not parse the SDK version out of $DOCPATH."
            exit 1
          fi
          echo "Windows SDK: $SDK"
          echo "SDK=$SDK" >> $GITHUB_ENV

          # prepare.py cherry-picks patches onto third-party checkouts.
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Native Tools Command Prompt.
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          # Pin the toolset. The runner's VS 2026 image defaults to MSVC 14.51,
          # but the app is linked with v143 (14.44); building the deps with 14.51
          # emits __std_* STL helpers that 14.44's link libs lack -> LNK2019.
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      # Restore and save are split, and the key carries run_id, run_attempt and
      # the chain attempt so it can never pre-exist. actions/cache swallows a
      # duplicate-key save as a warning, which would silently discard hours.
      - name: Restore ThirdParty cache.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.os }}-x64-t1444-third-party-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.attempt }}
          restore-keys: |
            ${{ runner.os }}-x64-t1444-third-party-${{ env.CACHE_KEY }}-
            ${{ runner.os }}-x64-t1444-third-party-

      - name: Restore Libraries cache.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TBUILD }}\Libraries
          key: ${{ runner.os }}-x64-t1444-libs-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.attempt }}
          restore-keys: |
            ${{ runner.os }}-x64-t1444-libs-${{ env.CACHE_KEY }}-
            ${{ runner.os }}-x64-t1444-libs-

      - name: Mark start.
        shell: bash
        run: echo "LIBS_START=$(date +%s)" >> $GITHUB_ENV

      # No 'skip-release': that builds Debug-only libraries, which a Release app
      # cannot link against (/MT vs /MTd). ci-patch.sh trims the build to
      # Release-only instead, which is what gets this near one job's budget.
      # The box stays as a net: prepare.py checkpoints per stage and wipes any
      # half-built stage before retrying, so being cut off is safe. It never
      # resumes mid-stage, so one stage must still fit the box.
      - name: Libraries.
        id: libs
        timeout-minutes: ${{ fromJSON(env.LIBS_BOX_MINUTES) }}
        continue-on-error: true
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent

      # Must be the step immediately after Libraries, so the elapsed time covers
      # the boxed step alone. Timing it down in 'classify' would also count the
      # prune and the two multi-GB cache saves (~20-35 min), which is more than
      # the classifier's tolerance band — a real error that died short of the box
      # would be pushed over the line and misread as a timeout, chaining ~10h.
      - name: Mark end.
        if: always()
        shell: bash
        run: echo "LIBS_END=$(date +%s)" >> $GITHUB_ENV

      - name: Free up some disk space.
        if: always()
        shell: bash
        run: |
          find $TBUILD/Libraries '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.dll' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' ')' -type f ')' -o -empty ')' -delete || true

          # The whole repo gets 10 GB of cache. Going over does not fail the save;
          # it evicts older entries by last-access, so successive generations
          # thrash and warm builds quietly turn cold.
          SIZE=$(du -sm "$TBUILD/Libraries" 2>/dev/null | cut -f1 || echo 0)
          echo "Libraries tree: ${SIZE} MB (uncompressed)"
          if [ "$SIZE" -gt 20000 ]; then
            echo "::warning::Libraries is ${SIZE} MB uncompressed. Against a 10 GB repo cache this will evict itself between runs."
          fi

      - name: Save ThirdParty cache.
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.os }}-x64-t1444-third-party-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.attempt }}

      - name: Save Libraries cache.
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TBUILD }}\Libraries
          key: ${{ runner.os }}-x64-t1444-libs-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.attempt }}

      # Last, so the caches are always banked first and the verdict reads last.
      # Distinguishes "ran out of time" (chain on) from "actually broke" (stop):
      # retrying a real error just burns another 5h and reports the wrong cause.
      - name: Classify the outcome.
        id: classify
        if: always()
        shell: bash
        run: |
          # Unset means Libraries never started — setup broke before it. Bash
          # would read the blanks as 0 and compute an elapsed time of one Unix
          # epoch, sailing past the timeout test and reporting "no action needed"
          # over the top of the real error.
          if [ -z "$LIBS_START" ] || [ -z "$LIBS_END" ]; then
            echo "done=false" >> "$GITHUB_OUTPUT"
            echo "::error::The Libraries step never ran — setup failed before it started. Read the log above; this is not a timeout, and the chain cannot help."
            exit 1
          fi

          ELAPSED=$(( LIBS_END - LIBS_START ))
          BOX=$(( LIBS_BOX_MINUTES * 60 ))
          echo "Libraries ran ${ELAPSED}s of a ${BOX}s box (outcome: ${{ steps.libs.outcome }})."

          if [ "${{ steps.libs.outcome }}" = "success" ]; then
            echo "Dependency tree is complete."
            echo "done=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Within 5% of the box means the timeout cut it off mid-stage. Dying
          # meaningfully short of the box is a genuine build failure.
          if [ "$ELAPSED" -ge $(( BOX * 95 / 100 )) ]; then
            echo "::warning::Out of time with work left. Progress is cached — the next attempt in this run continues from here. No action needed."
            echo "done=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "done=false" >> "$GITHUB_OUTPUT"
          echo "::error::Dependency build FAILED after ${ELAPSED}s — a real error, not a timeout. Read the Libraries step log above; re-running will not help."
          exit 1
